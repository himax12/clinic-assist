[project]
name = "clinic-assist"
version = "0.1.0"
description = "Synthetic clinic inbox agent with MCP tools and separate evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "mcp>=1,<2", "openai>=2,<3", "python-dotenv>=1,<2", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
clinic-assist = "clinic_assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
